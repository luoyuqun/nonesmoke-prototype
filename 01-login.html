<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoneSmoke - 登录页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 50%, #e0f2f1 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .phone {
    width: 375px;
    height: 760px;
    background: #f5faf5;
    border-radius: 40px;
    border: 10px solid #1a1a1a;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(46, 125, 50, 0.2);
  }
  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 28px;
    background: #1a1a1a;
    border-radius: 0 0 18px 18px;
    z-index: 100;
  }
  .status-bar {
    height: 44px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 13px;
    font-weight: 600;
    color: #1b5e20;
    padding-top: 8px;
  }
  .app-content {
    height: calc(760px - 44px);
    overflow: hidden;
    position: relative;
  }

  /* LOGIN PAGE */
  .login-page {
    height: 100%;
    background: linear-gradient(180deg, #81c784 0%, #a5d6a7 30%, #c8e6c9 60%, #f5faf5 100%);
    display: flex;
    flex-direction: column;
    padding: 60px 30px 30px;
  }
  .login-logo {
    margin-top: 40px;
    text-align: center;
  }
  .login-logo-icon {
    width: 90px;
    height: 90px;
    background: #ffffff;
    border-radius: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    box-shadow: 0 8px 24px rgba(46, 125, 50, 0.2);
    margin-bottom: 16px;
  }
  .login-logo h1 {
    color: #2e7d32;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .login-logo p {
    color: #558b2f;
    font-size: 13px;
    margin-top: 6px;
    opacity: 0.8;
  }
  .login-form {
    margin-top: 50px;
    background: #ffffff;
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 4px 20px rgba(76, 175, 80, 0.1);
  }
  .login-input-group { margin-bottom: 18px; }
  .login-input-group label {
    display: block;
    font-size: 12px;
    color: #689f38;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .login-input {
    width: 100%;
    height: 46px;
    border: 1.5px solid #c8e6c9;
    border-radius: 12px;
    padding: 0 14px;
    font-size: 14px;
    background: #f9fcf9;
    outline: none;
  }
  .login-btn {
    width: 100%;
    height: 50px;
    background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
  }
  .login-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 18px;
  }
  .login-divider-line { flex: 1; height: 1px; background: #e8f5e9; }
  .login-divider-text { font-size: 11px; color: #9e9e9e; }
  .login-social {
    display: flex;
    justify-content: center;
    gap: 20px;
  }
  .social-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #f5faf5;
    border: 1px solid #e8f5e9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
  }
  .login-footer {
    margin-top: auto;
    text-align: center;
    font-size: 12px;
    color: #7cb342;
  }
  .login-footer a { color: #33691e; font-weight: 600; }
</style>
</head>
<body>
  <div class="phone">
    <div class="phone-notch"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 🔋</span>
    </div>
    <div class="app-content">
      <div class="login-page">
        <div class="login-logo">
          <div class="login-logo-icon">🌿</div>
          <h1>NoneSmoke</h1>
          <p>轻戒烟草，焕活新生</p>
        </div>
        <div class="login-form">
          <div class="login-input-group">
            <label>手机号</label>
            <input type="tel" class="login-input" placeholder="请输入手机号" value="138****8888">
          </div>
          <div class="login-input-group">
            <label>验证码</label>
            <input type="text" class="login-input" placeholder="6位验证码">
          </div>
          <button class="login-btn">登录 / 注册</button>
          <div class="login-divider">
            <div class="login-divider-line"></div>
            <span class="login-divider-text">其他登录方式</span>
            <div class="login-divider-line"></div>
          </div>
          <div class="login-social">
            <div class="social-btn">💬</div>
            <div class="social-btn">📱</div>
            <div class="social-btn">🍎</div>
          </div>
        </div>
        <div class="login-footer">
          登录即表示同意 <a>用户协议</a> 与 <a>隐私政策</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
